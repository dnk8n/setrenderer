[project]
name = "setrender"
version = "0.1.0"
description = "Render beat-synced music visualisation videos from DJ sets using templates"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "pygame-ce>=2.5",
  "pyyaml>=6.0",
]

[project.scripts]
setrender = "setrender.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setrender"]
