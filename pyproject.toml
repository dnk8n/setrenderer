[project]
name = "setrender"
version = "0.1.0"
description = "Render beat-synced music visualisation videos from DJ sets using templates"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "pygame-ce>=2.5",
  "pyyaml>=6.0",
  "wgpu>=0.32",                                                   # GPU engine (WebGPU on Metal/Vulkan/DX12)
  "pyobjc-framework-SoundAnalysis>=12; sys_platform == 'darwin'",  # on-device sound classifier (Core ML)
  "cma>=4.5",                                                     # crucible: CMA-ES (Hansen's reference implementation)
  "ribs>=0.12",                                                   # crucible: MAP-Elites and CMA-ME (pyribs)
  "neat-python>=2.0",                                             # crucible: NEAT
  "deap>=1.4",                                                    # crucible: genetic algorithm operators
]

[project.scripts]
setrender = "setrender.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setrender"]
